<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>监察数据中心 · 专题页</title>
  <style>
    :root { font-family: "Microsoft YaHei", Arial, sans-serif; color: #1f2b36; background: #eef2f5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { min-height: 58px; background: #12395a; color: #fff; display: grid; grid-template-columns: 280px 1fr auto; align-items: center; gap: 14px; padding: 0 18px; }
    h1 { font-size: 18px; margin: 0; font-weight: 650; white-space: nowrap; }
    .topnav { display: flex; gap: 8px; flex-wrap: wrap; }
    .topnav button { border: 1px solid #276b9d; background: #287bb6; color: #fff; border-radius: 4px; padding: 7px 11px; cursor: pointer; font: inherit; }
    .topnav button.active { background: #fff; color: #12395a; border-color: #fff; }
    .meta { color: #d9e8f2; font-size: 12px; text-align: right; }
    main { padding: 18px; max-width: 1180px; margin: 0 auto; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .toolbar label { font-size: 13px; color: #354c60; }
    .toolbar input, .toolbar select { border: 1px solid #c6d4df; border-radius: 4px; padding: 6px 8px; font: inherit; }
    .card { background: #fff; border: 1px solid #d4dee7; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .card h2 { font-size: 15px; margin: 0 0 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .metric { background: #f7fafc; border: 1px solid #dbe5ee; border-radius: 6px; padding: 10px 12px; }
    .metric .value { font-size: 22px; font-weight: 700; color: #12395a; }
    .metric .label { font-size: 12px; color: #5f7385; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid #e3ebf2; }
    th { background: #f2f6fa; color: #354c60; }
    .empty { color: #8a97a5; font-size: 13px; padding: 12px 0; }
    .notice { border: 1px solid #e6c35c; background: #fff8e6; color: #6b5200; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
    .flag { display: inline-block; background: #eef3f8; border: 1px solid #d4dee7; border-radius: 10px; font-size: 11px; padding: 2px 7px; margin: 2px 3px 0 0; color: #4a5a6b; }
    .meta-line { width: 100%; font-size: 12px; color: #5f7385; background: #f2f6fa; border: 1px solid #dbe5ee; border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; line-height: 1.7; }
    .meta-line b { color: #12395a; }
    .coverage-full { color: #1c7a3d; font-weight: 700; }
    .coverage-partial { color: #8a6d1a; font-weight: 700; }
    .coverage-empty { color: #b23b3b; font-weight: 700; }
    .state-on { color: #1c7a3d; font-weight: 700; }
    .state-unknown { color: #8a6d1a; font-weight: 700; }
    .state-off { color: #b23b3b; font-weight: 700; }
    @media (max-width: 760px) {
      header { grid-template-columns: 1fr; gap: 8px; padding: 10px 14px; }
      .meta { text-align: left; }
    }
  </style>
</head>
<body>
  <header>
    <h1>监察数据中心</h1>
    <nav class="topnav">
      <button id="tab-devices">设备运行</button>
      <button id="tab-media">视频上传</button>
      <button id="tab-realtime">监察使用</button>
      <button id="tab-inspections">监察记录</button>
      <button id="tab-flights_tasks">航班/任务</button>
      <button id="tab-alarms">告警异常</button>
      <button id="tab-data_quality">数据质量</button>
    </nav>
    <div class="meta">v{{CHA_V2_VERSION}} · {{CHA_V2_BUILD}}</div>
  </header>
  <main>
    <div class="toolbar">
      <label>范围：近
        <select id="days">
          <option value="1">1 天</option>
          <option value="7" selected>7 天</option>
          <option value="30">30 天</option>
        </select>
      </label>
      <button id="refresh">刷新</button>
      <span id="scopeText" class="empty"></span>
    </div>
    <div id="metaText" class="meta-line" style="display:none"></div>
    <div id="notice" class="notice" style="display:none"></div>
    <div id="content"></div>
  </main>
  <script>
    const ACTIVE = "{{CHA_INSPECTION_ACTIVE}}";
    const ENDPOINTS = {
      devices: "/api/v2/inspection/devices",
      media: "/api/v2/inspection/media",
      realtime: "/api/v2/inspection/realtime",
      inspections: "/api/v2/inspections",
      flights_tasks: "/api/v2/inspection/flights-tasks",
      alarms: "/api/v2/inspection/alarms",
      data_quality: "/api/v2/inspection/data-quality"
    };
    const TITLES = {
      devices: "设备运行分析",
      media: "视频上传与文件分析",
      realtime: "监察使用分析",
      inspections: "监察记录",
      flights_tasks: "航班与维修任务",
      alarms: "告警与异常分析",
      data_quality: "数据质量"
    };
    const byId = (id) => document.getElementById(id);

    function esc(text) {
      return String(text == null ? "" : text)
        .replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[ch]));
    }

    function setActiveTab(tab) {
      Object.keys(ENDPOINTS).forEach((key) => {
        byId("tab-" + key).classList.toggle("active", key === tab);
      });
    }

    function showNotice(message) {
      const notice = byId("notice");
      notice.textContent = message;
      notice.style.display = message ? "block" : "none";
    }

    function metric(value, label) {
      return `<div class="metric"><div class="value">${esc(value)}</div><div class="label">${esc(label)}</div></div>`;
    }

    function flags(items) {
      if (!items || !items.length) return "";
      return items.map((f) => `<span class="flag">${esc(f)}</span>`).join("");
    }

    function fmtLocal(value) {
      if (!value) return "--";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return esc(String(value));
      return d.toLocaleString("zh-CN", { timeZone: "Asia/Shanghai", hour12: false });
    }

    function renderMeta(data) {
      const meta = (data && data.meta) || {};
      const box = byId("metaText");
      if (!meta.generated_at && !meta.coverage && !meta.quality) {
        box.style.display = "none";
        return;
      }
      const cov = meta.coverage || {};
      const quality = meta.quality || {};
      const freshness = meta.freshness || {};
      const freshKeys = Object.keys(freshness).filter((k) => freshness[k] != null);
      let covHtml = "--";
      if (cov.completeness) {
        const cls = "coverage-" + String(cov.completeness).toLowerCase();
        covHtml = `<span class="${cls}">${esc(cov.completeness)}</span>` +
          `（可用 ${esc(cov.available_coverage_days == null ? "--" : cov.available_coverage_days)} / 请求 ${esc(cov.requested_window_days == null ? "--" : cov.requested_window_days)} 天` +
          (cov.coverage_start_date ? `，${esc(cov.coverage_start_date)} ~ ${esc(cov.coverage_end_date || "")}` : "") + "）";
      }
      const flagsHtml = (quality.quality_flags || []).map((f) => `<span class="flag">${esc(f)}</span>`).join("");
      box.innerHTML =
        "<b>数据更新时间：</b>" + fmtLocal(meta.generated_at) +
        "（北京时间 Asia/Shanghai）&nbsp;|&nbsp;<b>数据覆盖：</b>" + covHtml +
        (freshKeys.length
          ? "&nbsp;|&nbsp;<b>源数据新鲜度：</b>" +
            freshKeys.map((k) => `${esc(k)}=${fmtLocal(freshness[k])}`).join("，")
          : "") +
        (flagsHtml ? "&nbsp;|&nbsp;<b>质量标记：</b>" + flagsHtml : "");
      box.style.display = "block";
    }

    async function load() {
      const days = byId("days").value;
      const tab = ACTIVE;
      showNotice("");
      byId("content").innerHTML = '<div class="empty">正在加载…</div>';
      byId("metaText").style.display = "none";
      const url = tab === "flights_tasks"
        ? ENDPOINTS[tab]
        : ENDPOINTS[tab] + "?days=" + days;
      let response;
      try {
        response = await fetch(url, { headers: { "Accept": "application/json" } });
      } catch (err) {
        byId("content").innerHTML = '<div class="empty">数据服务当前不可用。</div>';
        return;
      }
      let payload;
      try {
        payload = await response.json();
      } catch (err) {
        byId("content").innerHTML = '<div class="empty">数据服务返回了无法解析的响应。</div>';
        return;
      }
      if (!response.ok) {
        const code = payload && payload.data && payload.data.code ? payload.data.code : "unknown";
        if (code === "feature_disabled" || code === "store_not_configured") {
          byId("content").innerHTML =
            '<div class="empty">数据源未接入/待验证：当前尚未配置监察历史数据源，无法生成该专题指标。</div>';
        } else {
          byId("content").innerHTML = '<div class="empty">数据服务暂不可用（' + esc(code) + '）。</div>';
        }
        return;
      }
      const data = payload.data || {};
      const scope = data.scope || {};
      if (scope.start) {
        byId("scopeText").textContent = "范围（北京时间）：" + fmtLocal(scope.start) + " ~ " + fmtLocal(scope.end);
      }
      renderMeta(data);
      if (tab === "devices") renderDevices(data.overview || {});
      else if (tab === "media") renderMedia(data.overview || {});
      else if (tab === "realtime") renderRealtime(data.overview || {}, data.runtime || null);
      else if (tab === "inspections") renderInspections(data);
      else if (tab === "flights_tasks") renderFlightsTasks(data.overview || {});
      else if (tab === "alarms") renderAlarms(data.overview || {});
      else renderDataQuality(data.overview || {});
    }

    function renderDevices(overview) {
      const uptime = overview.uptime || {};
      const devices = (uptime.devices || []).map((item) => {
        const latest = (overview.latest_by_device || []).find((l) => l.device_id === item.device_id);
        let state;
        if (latest && latest.latest_online === true) state = '<span class="state-on">在线</span>';
        else if (latest && latest.latest_online === false) state = '<span class="state-off">离线</span>';
        else state = '<span class="state-unknown">未知</span>';
        const rate = (item.window_end && item.window_start) ?
          ((item.online_seconds / Math.max(1, (new Date(item.window_end) - new Date(item.window_start)) / 1000)) * 100).toFixed(1) : "--";
        return `<tr>
          <td>${esc(item.device_id)}</td>
          <td>${state}</td>
          <td>${esc(rate)}%</td>
          <td>${esc(item.online_seconds)}s</td>
          <td>${esc(item.offline_transition_count)}</td>
          <td>${esc(item.first_online_at || "--")}</td>
          <td>${esc(item.last_offline_at || "--")}</td>
          <td>${flags(item.quality_flags)}</td>
          <td><button class="timeline-btn" data-device="${esc(item.device_id)}">时间线</button></td>
        </tr>`;
      }).join("");
      const groupRows = (overview.groups || []).map((item) => `<tr>
        <td>${esc(item.group_id || "未知分组")}</td>
        <td>${esc(item.device_count)}</td>
        <td>${esc(item.online_count)}</td>
        <td>${esc(item.offline_count)}</td>
        <td>${esc(item.unknown_count)}</td>
        <td>${esc(item.online_seconds)}s</td>
      </tr>`).join("");
      byId("content").innerHTML =
        '<div class="grid">' +
        metric(overview.current_online_count == null ? "--" : overview.current_online_count, "当前在线") +
        metric(overview.current_offline_count == null ? "--" : overview.current_offline_count, "当前离线") +
        metric(overview.current_unknown_count == null ? "--" : overview.current_unknown_count, "当前状态未知") +
        metric(uptime.fetched_count == null ? "--" : uptime.fetched_count, "历史事件行数") +
        '</div>' +
        '<div class="card"><h2>设备状态明细</h2>' +
        (devices ? '<table><thead><tr><th>设备</th><th>状态</th><th>在线率</th><th>在线时长</th><th>掉线次数</th><th>最近上线</th><th>最近离线</th><th>质量</th><th>操作</th></tr></thead><tbody>' + devices + '</tbody></table>'
          : '<div class="empty">暂无可展示的设备状态历史。</div>') +
        '</div>' +
        '<div class="card"><h2>按分组</h2>' +
        (groupRows ? '<table><thead><tr><th>分组</th><th>设备数</th><th>在线</th><th>离线</th><th>未知</th><th>在线时长</th></tr></thead><tbody>' + groupRows + '</tbody></table>'
          : '<div class="empty">暂无可展示的分组统计。</div>') +
        '</div>' +
        '<div class="card" id="timelinePanel" style="display:none"></div>' +
        '<div class="empty">说明：在线率按窗口内在线时长/窗口时长计算；“长时间离线”等需要治理阈值的分类暂不产出。</div>';
      document.querySelectorAll(".timeline-btn").forEach((button) => {
        button.addEventListener("click", () => {
          loadTimeline(button.getAttribute("data-device"));
        });
      });
    }

    async function loadTimeline(deviceId) {
      const days = byId("days").value;
      const panel = byId("timelinePanel");
      panel.style.display = "block";
      panel.innerHTML = '<div class="empty">正在加载设备时间线…</div>';
      let response;
      try {
        response = await fetch(
          "/api/v2/inspection/devices/" +
            encodeURIComponent(deviceId) +
            "/timeline?days=" + days,
          { headers: { "Accept": "application/json" } }
        );
      } catch (err) {
        panel.innerHTML = '<div class="empty">设备时间线当前不可用。</div>';
        return;
      }
      let payload;
      try {
        payload = await response.json();
      } catch (err) {
        panel.innerHTML = '<div class="empty">设备时间线返回了无法解析的响应。</div>';
        return;
      }
      if (!response.ok) {
        panel.innerHTML = '<div class="empty">设备时间线暂不可用（' +
          esc((payload && payload.data && payload.data.code) || "unknown") +
          "）。</div>";
        return;
      }
      const timeline = (payload.data || {}).timeline || {};
      const statusRows = (timeline.status_events || []).map((event) => `<tr>
        <td>${esc(event.occurred_at)}</td>
        <td>${esc(event.status_code)}</td>
        <td>${event.online === true ? "在线" : (event.online === false ? "离线" : "未知")}</td>
        <td>${flags(event.quality_flags)}</td>
      </tr>`).join("");
      const mediaRows = (timeline.media_files || []).map((item) => `<tr>
        <td>${esc(item.title || "--")}</td>
        <td>${esc(item.media_kind || "--")}</td>
        <td>${esc(item.created_at_source || item.uploaded_at_source || "--")}</td>
        <td>${item.duration_seconds == null ? "--" : esc(item.duration_seconds) + "s"}</td>
        <td>${item.file_size_bytes == null ? "--" : esc(item.file_size_bytes) + "B"}</td>
      </tr>`).join("");
      const locationRows = (timeline.location_points || []).map((point) => `<tr>
        <td>${esc(point.gps_occurred_at)}</td>
        <td>${point.speed_value == null ? "--" : esc(point.speed_value)}</td>
        <td>${point.accuracy_value == null ? "--" : esc(point.accuracy_value)}</td>
        <td>${point.battery_value == null ? "--" : esc(point.battery_value)}</td>
        <td>${point.gps_type_code == null ? "--" : esc(point.gps_type_code)}</td>
        <td>${point.network_type_code == null ? "--" : esc(point.network_type_code)}</td>
      </tr>`).join("");
      panel.innerHTML =
        '<h2>设备时间线：' + esc(deviceId) + '</h2>' +
        '<div class="grid">' +
        metric(timeline.status_event_count == null ? "--" : timeline.status_event_count, "状态事件") +
        metric(timeline.media_file_count == null ? "--" : timeline.media_file_count, "媒体文件") +
        metric(timeline.location_point_count == null ? "--" : timeline.location_point_count, "位置点") +
        '</div>' +
        '<div class="card"><h3>状态变化</h3>' +
        (statusRows ? '<table><thead><tr><th>时间</th><th>status</th><th>在线</th><th>质量</th></tr></thead><tbody>' + statusRows + '</tbody></table>'
          : '<div class="empty">该设备在范围内无状态事件。</div>') +
        '</div>' +
        '<div class="card"><h3>媒体文件</h3>' +
        (mediaRows ? '<table><thead><tr><th>标题</th><th>类型</th><th>时间</th><th>时长</th><th>容量</th></tr></thead><tbody>' + mediaRows + '</tbody></table>'
          : '<div class="empty">该设备在范围内无媒体文件。</div>') +
        '</div>' +
        '<div class="card"><h3>位置点</h3>' +
        (locationRows ? '<table><thead><tr><th>时间</th><th>速度</th><th>精度</th><th>电量</th><th>GPS 类型</th><th>网络类型</th></tr></thead><tbody>' + locationRows + '</tbody></table>'
          : '<div class="empty">该设备在范围内无位置点。</div>') +
        '</div>' +
        '<div class="empty">说明：位置点不输出坐标（坐标受限制）；如需地图下钻，须在明确授权方案后另行开放。</div>';
    }

    function renderMedia(overview) {
      const media = overview.media || {};
      const devices = (media.devices || []).map((item) => `<tr>
        <td>${esc(item.device_id)}</td>
        <td>${esc(item.total_files)}</td>
        <td>${esc(item.video_count)}</td>
        <td>${esc(item.image_count)}</td>
        <td>${esc(item.audio_count)}</td>
        <td>${esc(item.video_duration_seconds)}s</td>
        <td>${esc(item.file_size_bytes)}B</td>
        <td>${flags(item.quality_flags)}</td>
      </tr>`).join("");
      const groupRows = (overview.groups || []).map((item) => `<tr>
        <td>${esc(item.group_id || "未知分组")}</td>
        <td>${esc(item.file_count)}</td>
        <td>${esc(item.video_count)}</td>
        <td>${esc(item.image_count)}</td>
        <td>${esc(item.audio_count)}</td>
        <td>${esc(item.video_duration_seconds)}s</td>
        <td>${esc(item.file_size_bytes)}B</td>
      </tr>`).join("");
      const daily = (overview.daily_counts || []).map((pair) =>
        `<tr><td>${esc(pair[0])}</td><td>${esc(pair[1])}</td></tr>`
      ).join("");
      const longNoUploadRows = (overview.long_no_upload_devices || []).map((item) => `<tr>
        <td>${esc(item.device_id)}</td>
        <td>${esc(item.reference_at)}</td>
        <td>${esc(item.age_seconds)}s</td>
      </tr>`).join("");
      byId("content").innerHTML =
        '<div class="grid">' +
        metric(media.fetched_count == null ? "--" : media.fetched_count, "范围内文件数") +
        metric(overview.latest_uploaded_at || "--", "最近上传时间") +
        metric(overview.latest_created_at || "--", "最近拍摄时间") +
        '</div>' +
        '<div class="card"><h2>每设备上传量</h2>' +
        (devices ? '<table><thead><tr><th>设备</th><th>总数</th><th>视频</th><th>图片</th><th>音频</th><th>视频时长</th><th>容量</th><th>质量</th></tr></thead><tbody>' + devices + '</tbody></table>'
          : '<div class="empty">暂无可展示的视频/文件历史。</div>') +
        '</div>' +
        '<div class="card"><h2>按分组</h2>' +
        (groupRows ? '<table><thead><tr><th>分组</th><th>文件数</th><th>视频</th><th>图片</th><th>音频</th><th>视频时长</th><th>容量</th></tr></thead><tbody>' + groupRows + '</tbody></table>'
          : '<div class="empty">暂无可展示的分组统计。</div>') +
        '</div>' +
        '<div class="card"><h2>按日上传趋势</h2>' +
        (daily ? '<table><thead><tr><th>日期</th><th>数量</th></tr></thead><tbody>' + daily + '</tbody></table>'
          : '<div class="empty">暂无可展示的每日趋势。</div>') +
        '</div>' +
        '<div class="card"><h2>长时间未上传设备</h2>' +
        (longNoUploadRows ? '<table><thead><tr><th>设备</th><th>最近上传</th><th>已间隔</th></tr></thead><tbody>' + longNoUploadRows + '</tbody></table>'
          : (overview.long_no_upload_governed
            ? '<div class="empty">当前无超过受治理阈值的设备。</div>'
            : '<div class="empty">未配置受治理阈值（CHA_V2_INSPECTION_THRESHOLDS），不产出该分类。</div>')) +
        '</div>' +
        '<div class="empty">说明：“长时间未上传”等需要治理阈值的分类暂不产出。</div>';
    }

    function renderRealtime(overview, runtime) {
      const aggregation = overview.aggregation || {};
      const runtimeCards = runtime
        ? metric(runtime.active_sessions == null ? "--" : runtime.active_sessions, "当前实时会话") +
          metric(runtime.active_streams == null ? "--" : runtime.active_streams, "当前实时流") +
          metric(runtime.gateway_connections == null ? "--" : runtime.gateway_connections, "Gateway 连接") +
          metric(runtime.media_connections == null ? "--" : runtime.media_connections, "Media 连接")
        : metric("--", "当前实时会话（需启用 realtime 运行态）");
      const users = (aggregation.users || []).map((item) => `<tr>
        <td>${esc(item.dimension_id)}</td>
        <td>${esc(item.view_count)}</td>
        <td>${esc(item.view_duration_seconds)}s</td>
        <td>${esc(item.played_count)}</td>
        <td>${esc(item.first_frame_count)}</td>
      </tr>`).join("");
      const devices = (aggregation.devices || []).map((item) => `<tr>
        <td>${esc(item.dimension_id)}</td>
        <td>${esc(item.view_count)}</td>
        <td>${esc(item.view_duration_seconds)}s</td>
        <td>${esc(item.played_count)}</td>
      </tr>`).join("");
      const reasons = (aggregation.error_counts || []).map((pair) =>
        `<tr><td>${esc(pair[0])}</td><td>${esc(pair[1])}</td></tr>`
      ).join("");
      const total = aggregation.event_count == null ? "--" : aggregation.event_count;
      const played = aggregation.played_count == null ? "--" : aggregation.played_count;
      const success = (total === "--" || !total) ? "--" : ((played / total) * 100).toFixed(1) + "%";
      byId("content").innerHTML =
        '<div class="grid">' + runtimeCards + '</div>' +
        '<div class="grid">' +
        metric(total, "观看事件") +
        metric(success, "首帧成功率") +
        metric(aggregation.connection_duration_seconds == null ? "--" : aggregation.connection_duration_seconds + "s", "连接总时长") +
        metric(aggregation.view_duration_seconds == null ? "--" : aggregation.view_duration_seconds + "s", "观看总时长") +
        '</div>' +
        '<div class="card"><h2>每用户</h2>' +
        (users ? '<table><thead><tr><th>用户</th><th>次数</th><th>观看时长</th><th>播放成功</th><th>首帧</th></tr></thead><tbody>' + users + '</tbody></table>'
          : '<div class="empty">暂无可展示的监察使用历史。</div>') +
        '</div>' +
        '<div class="card"><h2>每设备</h2>' +
        (devices ? '<table><thead><tr><th>设备</th><th>次数</th><th>观看时长</th><th>播放成功</th></tr></thead><tbody>' + devices + '</tbody></table>'
          : '<div class="empty">暂无可展示的每设备观看历史。</div>') +
        '</div>' +
        '<div class="card"><h2>失败原因</h2>' +
        (reasons ? '<table><thead><tr><th>错误</th><th>次数</th></tr></thead><tbody>' + reasons + '</tbody></table>'
          : '<div class="empty">无失败原因记录。</div>') +
        '</div>';
    }

    function renderAlarms(overview) {
      const aggregation = overview.aggregation || {};
      const typeRows = (aggregation.alarm_type_counts || []).map((pair) =>
        `<tr><td>${esc(pair[0])}</td><td>${esc(pair[1])}</td><td>raw code（未映射）</td></tr>`
      ).join("");
      const statusRows = (aggregation.alarm_status_counts || []).map((pair) =>
        `<tr><td>${esc(pair[0])}</td><td>${esc(pair[1])}</td></tr>`
      ).join("");
      const dealStatusRows = (aggregation.deal_status_counts || []).map((pair) =>
        `<tr><td>${esc(pair[0])}</td><td>${esc(pair[1])}</td></tr>`
      ).join("");
      const deviceRows = (aggregation.devices || []).map((item) => `<tr>
        <td>${esc(item.device_id)}</td>
        <td>${esc(item.alarm_count)}</td>
        <td>${esc(JSON.stringify(item.alarm_type_counts))}</td>
      </tr>`).join("");
      byId("content").innerHTML =
        '<div class="grid">' +
        metric(aggregation.alarm_count == null ? "--" : aggregation.alarm_count, "告警数") +
        metric(aggregation.missing_alarm_status_count == null ? "--" : aggregation.missing_alarm_status_count, "状态缺失") +
        metric(aggregation.missing_deal_status_count == null ? "--" : aggregation.missing_deal_status_count, "处理状态缺失") +
        metric(aggregation.partial ? "是" : "否", "结果不完整") +
        '</div>' +
        '<div class="card"><h2>按告警类型（raw code）</h2>' +
        (typeRows ? '<table><thead><tr><th>类型 code</th><th>数量</th><th>说明</th></tr></thead><tbody>' + typeRows + '</tbody></table>'
          : '<div class="empty">暂无可展示的告警类型分布。</div>') +
        '</div>' +
        '<div class="card"><h2>按告警状态（raw code）</h2>' +
        (statusRows ? '<table><thead><tr><th>状态 code</th><th>数量</th></tr></thead><tbody>' + statusRows + '</tbody></table>'
          : '<div class="empty">暂无可展示的告警状态分布。</div>') +
        '</div>' +
        '<div class="card"><h2>按处理状态（raw code）</h2>' +
        (dealStatusRows ? '<table><thead><tr><th>处理状态 code</th><th>数量</th></tr></thead><tbody>' + dealStatusRows + '</tbody></table>'
          : '<div class="empty">暂无可展示的处理状态分布。</div>') +
        '</div>' +
        '<div class="card"><h2>每设备告警</h2>' +
        (deviceRows ? '<table><thead><tr><th>设备</th><th>告警数</th><th>类型分布</th></tr></thead><tbody>' + deviceRows + '</tbody></table>'
          : '<div class="empty">暂无可展示的每设备告警。</div>') +
        '</div>' +
        '<div class="empty">说明：alarm/status/deal 为原始 code，语义尚未验证，暂不映射为业务标签。</div>';
    }

    function renderInspections(data) {
      const items = (data && data.items) || [];
      const total = (data && data.total != null) ? data.total : items.length;
      const rows = items.map((item) => {
        const rec = item.record || item;
        const issue = rec.has_issue
          ? `<span class="state-on">是</span>`
          : `<span class="state-off">否</span>`;
        return `<tr>
          <td>${esc(rec.inspection_id || "--")}</td>
          <td>${esc(rec.inspector_username || "--")}</td>
          <td>${esc(rec.device_id || "--")}</td>
          <td>${esc(rec.aircraft_no || "--")}</td>
          <td>${esc(rec.flight_no || "--")}</td>
          <td>${esc(rec.station || "--")}</td>
          <td>${esc((rec.maintenance_task_text || "").slice(0, 40) || "--")}</td>
          <td>${issue}</td>
          <td>${esc(rec.status || "--")}</td>
          <td>${fmtLocal(rec.inspection_started_at)}</td>
        </tr>`;
      }).join("");
      byId("content").innerHTML =
        '<div class="grid">' +
        metric(total == null ? "--" : total, "监察记录总数") +
        metric(items.length == null ? "--" : items.length, "本页条数") +
        '</div>' +
        '<div class="card"><h2>监察记录</h2>' +
        (rows ? '<table><thead><tr><th>记录 ID</th><th>监察人</th><th>设备</th><th>飞机</th><th>航班</th><th>站点</th><th>维修任务</th><th>问题</th><th>状态</th><th>开始时间</th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<div class="empty">当前窗口内暂无监察记录。</div>') +
        '</div>' +
        '<div class="empty">说明：记录为真实生产监察数据；问题标记与状态为业务字段。</div>';
    }

    function renderFlightsTasks(overview) {
      const flights = (overview.flights || []).map((row) => `<tr>
        <td>${esc(row[1] || "--")}</td>
        <td>${esc(row[2] || "--")}</td>
        <td>${esc(row[3] || "--")}</td>
        <td>${esc(row[4] || "--")}</td>
      </tr>`).join("");
      const tasks = (overview.routine_tasks || []).map((row) => `<tr>
        <td>${esc(row[2] || "--")}</td>
        <td>${esc(row[1] || "--")}</td>
        <td>${esc(row[3] || "--")}</td>
        <td>${esc(row[4] || "--")}</td>
      </tr>`).join("");
      byId("content").innerHTML =
        '<div class="grid">' +
        metric(overview.source_flight_count == null ? "--" : overview.source_flight_count, "航班数") +
        metric(overview.source_task_count == null ? "--" : overview.source_task_count, "维修任务数") +
        '</div>' +
        '<div class="card"><h2>航班（参考）</h2>' +
        (flights ? '<table><thead><tr><th>航班号</th><th>飞机号</th><th>航段</th><th>状态</th></tr></thead><tbody>' + flights + '</tbody></table>'
          : '<div class="empty">当前日期暂无航班数据。</div>') +
        '</div>' +
        '<div class="card"><h2>维修任务（参考）</h2>' +
        (tasks ? '<table><thead><tr><th>任务类型</th><th>飞机号</th><th>机位</th><th>状态</th></tr></thead><tbody>' + tasks + '</tbody></table>'
          : '<div class="empty">当前日期暂无维修任务数据。</div>') +
        '</div>' +
        '<div class="empty">说明：本页为航班/维修任务只读参考视图（非自动关联），用于监察人员确认飞机/任务上下文。</div>';
    }

    function renderDataQuality(overview) {
      const tables = (overview.tables || []).map((item) => `<tr>
        <td>${esc(item.table)}</td>
        <td>${esc(item.row_count)}</td>
        <td>${esc(item.rows_with_quality_flags)}</td>
        <td>${esc(item.latest_at || "--")}</td>
        <td>${esc(item.distinct_device_count)}</td>
      </tr>`).join("");
      const flagRows = (overview.quality_flag_counts || []).map((pair) =>
        `<tr><td>${esc(pair[0])}</td><td>${esc(pair[1])}</td></tr>`
      ).join("");
      const sourceRows = (overview.source_system_counts || []).map((pair) =>
        `<tr><td>${esc(pair[0])}</td><td>${esc(pair[1])}</td></tr>`
      ).join("");
      byId("content").innerHTML =
        '<div class="grid">' +
        metric(overview.total_rows == null ? "--" : overview.total_rows, "窗口内总行数") +
        '</div>' +
        '<div class="card"><h2>各历史表</h2>' +
        (tables ? '<table><thead><tr><th>表</th><th>行数</th><th>含质量 flag</th><th>最新时间</th><th>设备数</th></tr></thead><tbody>' + tables + '</tbody></table>'
          : '<div class="empty">当前窗口内无任何历史数据。</div>') +
        '</div>' +
        '<div class="card"><h2>质量 flag 分布</h2>' +
        (flagRows ? '<table><thead><tr><th>flag</th><th>次数</th></tr></thead><tbody>' + flagRows + '</tbody></table>'
          : '<div class="empty">当前窗口内无质量 flag。</div>') +
        '</div>' +
        '<div class="card"><h2>来源系统分布</h2>' +
        (sourceRows ? '<table><thead><tr><th>来源</th><th>行数</th></tr></thead><tbody>' + sourceRows + '</tbody></table>'
          : '<div class="empty">当前窗口内无来源数据。</div>') +
        '</div>' +
        '<div class="empty">说明：本页报告 store 中真实存在的数据覆盖、新鲜度与质量 flag，不推断缺失数据。</div>';
    }

    document.addEventListener("DOMContentLoaded", () => {
      setActiveTab(ACTIVE);
      document.title = TITLES[ACTIVE] + " · 监察数据中心";
      Object.keys(ENDPOINTS).forEach((key) => {
        byId("tab-" + key).addEventListener("click", () => {
          window.location.href = "/api/v2/dashboard/" + key;
        });
      });
      byId("refresh").addEventListener("click", load);
      load();
    });
  </script>
</body>
</html>
