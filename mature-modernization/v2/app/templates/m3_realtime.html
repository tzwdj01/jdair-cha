<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:,">
  <title>CHA 实时视频监察</title>
  <link rel="stylesheet" href="/api/v2/realtime/assets/realtime.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </span>
      <span>
        <strong>实时视频监察</strong>
        <small>维修质量实时监控 · AEE 原生链路</small>
      </span>
    </a>
    <nav class="top-actions" aria-label="页面操作">
      <a class="button" href="/api/v2/dashboard">态势总览</a>
      <a class="button" href="/">返回系统</a>
      <button id="themeButton" class="button icon-button" type="button" aria-label="切换日间夜间风格">◐</button>
      <span class="build">v{{CHA_V2_VERSION}} · {{CHA_V2_BUILD}}</span>
    </nav>
  </header>

  <main class="page">
    <section class="summary panel" aria-label="实时会话摘要">
      <div class="summary-title">
        <span class="live-dot"></span>
        <div>
          <h1>实时监控工作台</h1>
          <p>单账号已验证最多 6 路；音频默认关闭，设备控制保持关闭</p>
        </div>
      </div>
      <dl class="summary-metrics">
        <div>
          <dt>会话</dt>
          <dd id="sessionStatus" data-tone="neutral">未开始</dd>
        </div>
        <div>
          <dt>在线设备</dt>
          <dd><b id="onlineCount">0</b> 台</dd>
        </div>
        <div>
          <dt>实时视频</dt>
          <dd><b id="streamCount">0</b> / <b id="streamLimit">6</b></dd>
        </div>
        <div>
          <dt>心跳</dt>
          <dd id="heartbeatStatus">未启动</dd>
        </div>
      </dl>
      <div class="summary-actions">
        <button id="reconnectButton" class="button warning hidden" type="button">重新建立监控</button>
        <button id="closeSessionButton" class="button danger" type="button" disabled>结束实时监控</button>
      </div>
    </section>

    <section id="globalNotice" class="notice" aria-live="polite"></section>

    <section class="workspace">
      <aside class="device-panel panel">
        <div class="panel-header">
          <div>
            <h2>终端设备</h2>
            <p>选择在线设备加入当前会话</p>
          </div>
          <button id="refreshDevicesButton" class="button icon-button" type="button" title="刷新设备">↻</button>
        </div>
        <div class="device-tools">
          <label class="search">
            <span aria-hidden="true">⌕</span>
            <input id="deviceSearch" type="search" placeholder="搜索设备编号或名称">
          </label>
          <div class="device-filter" role="tablist" aria-label="设备筛选">
            <button class="filter active" type="button" data-filter="online">在线</button>
            <button class="filter" type="button" data-filter="all">全部</button>
          </div>
        </div>
        <div id="deviceList" class="device-list" aria-live="polite">
          <div class="device-loading">正在加载设备…</div>
        </div>
        <div class="device-footer">
          <span>已勾选 <b id="selectedCount">0</b> 台</span>
          <button id="startSelectedButton" class="button primary" type="button" disabled>开始监控</button>
        </div>
      </aside>

      <section class="monitor-panel panel">
        <div class="panel-header monitor-header">
          <div>
            <h2>视频区域</h2>
            <p id="connectionStatus">尚未建立实时连接</p>
          </div>
          <div class="layout-indicator">
            <span>自动布局</span>
            <strong id="layoutStatus">1 路 / 4 路 / 6 路</strong>
          </div>
        </div>

        <div id="videoGrid" class="video-grid empty">
          <div id="emptyState" class="empty-state">
            <span class="empty-icon" aria-hidden="true">▦</span>
            <h3>尚未开始实时监控</h3>
            <p>从左侧选择在线设备，可同时监控最多 6 路实时视频。</p>
          </div>
        </div>

        <footer class="monitor-footer">
          <span><i class="status-dot ok"></i> 1 / 4 / 6 路布局</span>
          <span id="audioModeStatus"><i class="status-dot"></i> 音频默认关闭</span>
          <span id="footerMessage">等待选择设备</span>
        </footer>
      </section>
    </section>
  </main>

  <template id="videoTileTemplate">
    <article class="video-tile" data-status="CONNECTING">
      <header class="tile-header">
        <div>
          <strong data-device-id></strong>
          <small data-device-name></small>
        </div>
        <div class="tile-actions">
          <span class="status-badge" data-status-label>正在连接</span>
          <button class="tile-button audio hidden" type="button" data-action="audio" title="开启接收音频">🔇</button>
          <button class="tile-button" type="button" data-action="screenshot" title="保存当前画面截图">▣</button>
          <button class="tile-button" type="button" data-action="fullscreen" title="全屏">⛶</button>
          <button class="tile-button close" type="button" data-action="close" title="关闭视频">×</button>
        </div>
      </header>
      <div class="tile-stage">
        <video autoplay muted playsinline></video>
        <audio autoplay muted></audio>
        <div class="tile-overlay">
          <span class="spinner"></span>
          <strong data-overlay-title>正在建立实时连接</strong>
          <small data-overlay-detail>正在创建视频资源…</small>
          <button class="button retry hidden" type="button" data-action="retry">重试</button>
        </div>
      </div>
      <footer class="tile-footer">
        <span>分辨率 <b data-resolution>—</b></span>
        <span>Track <b data-track>—</b></span>
        <span>首帧 <b data-first-frame>等待中</b></span>
      </footer>
    </article>
  </template>

  <script src="/api/v2/realtime/assets/mcs8Client.js"></script>
  <script src="/api/v2/realtime/assets/multistream_runtime.js"></script>
  <script src="/api/v2/realtime/assets/realtime.js"></script>
</body>
</html>
